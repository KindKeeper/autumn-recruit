# ============================================================
# 全局配置：枚举定义、评分权重、分档阈值
# 数据文件(data/companies/*.yml)中出现的枚举值必须与此处一致
# 权重口径：沿用 jobhunt-2027 v3.0（在 160 岗位上验证过）
# ============================================================

# 流程七节点（顺序即漏斗顺序，勿随意调换）
stages:
  - {key: applied,        label: 投递}
  - {key: assessment,     label: 测评}
  - {key: written_test,   label: 笔试}
  - {key: interview_1,    label: 一面}
  - {key: interview_2,    label: 二面}
  - {key: interview_more, label: 更多面}
  - {key: offer,          label: offer}

# 终态标签（正交于七节点，不参与阶段推导）
outcomes:
  - {key: rejected,  label: 已挂}
  - {key: given_up,  label: 已放弃}
  - {key: frozen,    label: 已冻结}
  - {key: expired,   label: 已过期}
  - {key: pool,      label: 泡池子}
  - {key: signed,    label: 已签约}

# 面试归因枚举（interviews[].cause）
causes: [信息差, 能力差, 表达差, 策略差]

# 专业边界（boundary）：C=红线剔除，不进优先级总表
boundaries: [S, A, B, C, 待定]

# 评分权重（合计100，单项0-10；jobhunt v3.0 口径）
score_weights:
  fit: 25        # 匹配：技术栈+方向对口程度
  track: 15      # 赛道：企业赛道与主线契合度
  city: 20       # 城市：按个人20城排序（合肥主场优先）
  salary: 10     # 薪资：总包与时薪综合
  stability: 10  # 稳定：业务线/公司收缩风险
  certainty: 10  # 确定：offer确定性（流程透明/养鱼名声）
  urgency: 5     # 紧迫：按投递截止剩余天数派生
  wlb: 5         # 强度：加班文化

score_mode: additive

# 优先级分档阈值：总分>=80为A，>=65为B，>=50为C，其余D
priority_tiers: {A: 80, B: 65, C: 50}

channels: [官网, 邮箱, 内推, 智联, BOSS直聘, 牛客, 宣讲会, 猎聘, 其他]
groups: [提前批, 正式批, 实习, 未启动, 补录]

# 城市评分三层结构: table 显式 override > cities 数据走公式 > default(告警)
# 维护规则: 新城市登记 cities(距离+GDP)即可自动出分;公式与裁定不一致才在 table 加 override
city_anchors:
  mode: formula            # 新城市走公式；已登记城市若 table 有值则以 table 为准（显式 override）
  default: 4               # 无 GDP/距离数据时的兜底
  cap_non_home: 8          # 非合肥城市封顶8（合肥=距离0+home_bonus可破封）
  floor: 3
  home_city: 合肥
  home_bonus: 2
  gdp_bands:               # GDP(万亿)→base,从高到低匹配
    - {min: 3.5, base: 9.3}
    - {min: 1.8, base: 9.0}
    - {min: 1.2, base: 8.4}
    - {min: 0.9, base: 8.0}
    - {min: 0.6, base: 7.2}
    - {min: 0.35, base: 6.3}
    - {min: 0, base: 5.2}
  dist_bands:              # 距合肥km→扣分,从低到高匹配
    - {max: 200, penalty: 0}
    - {max: 500, penalty: 0.3}
    - {max: 900, penalty: 0.7}
    - {max: 1300, penalty: 1.1}
    - {max: 99999, penalty: 1.5}
  cities:                  # 城市: [距合肥km(直线), GDP万亿]——公式模式的原料
    合肥: [0, 1.27]
